name: 🚀 Microservices CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================================
  # STAGE 1: Maven Build & Test
  # ============================================================================
  maven-build:
    name: ☕ Maven Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: ⚙️ Build all modules with Maven
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

  # ============================================================================
  # STAGE 2: Docker Build & Push (Parallel Matrix for all 3 Microservices)
  # ============================================================================
  docker-build-push:
    name: 🐳 Docker Build & Push (${{ matrix.service }})
    needs: [maven-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR write access
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - payment-service
          - notification-service
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Calculate Image Tag
        id: vars
        run: |
          echo "TAG=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: 🐳 Build & Push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ steps.vars.outputs.TAG }}

  # ============================================================================
  # STAGE 3: Helm Charts Lint & Verification
  # ============================================================================
  helm-verify:
    name: ⎈ Helm Lint & Validation
    needs: [docker-build-push]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Helm
        uses: azure/setup-helm@v4

      - name: 🔍 Lint Helm Charts
        run: |
          echo "Validating order-service chart..."
          helm lint helm/order-service
          echo "Validating payment-service chart..."
          helm lint helm/payment-service
          echo "Validating notification-service chart..."
          helm lint helm/notification-service
          echo "All Helm charts validated successfully!"
